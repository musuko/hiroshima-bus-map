<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>路線バスマップ</title>
    <link rel="icon" href="data:,">
    <!-- ZIP解凍用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- 修正：Leafletのライブラリ（CSSとJS）のURLを正しく指定 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- 自作CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="header">
        <div class="header-text">広島県路線バス</div>
        <!-- ★追加：会社選択ボタン -->
        <button id="btn-company-filter" class="header-btn">会社選択</button>
    </div>
    <div id="map"></div>

    <!-- ★追加：バス会社選択のモーダル（初期状態は非表示） -->
    <div id="company-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>表示するバス会社</h3>
            <div class="modal-actions">
                <button id="btn-check-all">全選択</button>
                <button id="btn-uncheck-all">全解除</button>
            </div>
            <!-- ここにJSでチェックボックスのリストを自動生成します -->
            <div id="company-list"></div>
            
            <button id="btn-close-modal" class="close-btn">決定して閉じる</button>
        </div>
    </div>
    
    <!-- JS（順番重要） -->
    <script src="js/config.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/gtfs_loader.js"></script>
    <script src="js/map.js"></script>
    <script src="js/stops.js"></script>
    <script src="js/trip_details.js"></script>
    <script src="js/timetable.js"></script>
    <script src="js/buses.js"></script>
    <script src="js/main.js"></script>
</body>


</html>
